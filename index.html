    <script>
      // Apply theme, language and direction before the first paint to avoid a flash.
      try {
        var read = function (key) { try { return JSON.parse(localStorage.getItem(key)) } catch (e) { return null } }
        var lang = read('mm.lang') || (navigator.language && navigator.language.indexOf('ar') === 0 ? 'ar' : 'en')
        var root = document.documentElement
        root.lang = lang
        root.dir = lang === 'ar' ? 'rtl' : 'ltr'
        root.dataset.theme = read('mm.theme') || 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
